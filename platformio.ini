[platformio]
default_envs = mega2-release

[env]
monitor_port = COM11
monitor_speed = 115200
upload_port = COm11

; -----------------------------
; Debug flags shared by ALL debug envs
; -----------------------------
[debug_common]
build_flags =
    -DDEBUG_LOOP_PERFORMANCE=1
    -DDEBUG_LOOP_PERFORMANCE_LOG=1

; ============================================================
; Mega2 PlatformIO Environments – Zweck & Workflow
; ============================================================
;
; Ziel:
; - SIM für Entwicklung ohne Anlage
; - HW für Tests an der realen Anlage
; - Default ist RELEASE (ruhig, sicher, keine Debug-Spam-Flags)
;
; Empfohlener Workflow:
; 1) Alltag / Entwicklung ohne Anlage:
;    -> env: mega2-sim
;       - Simulation aktiv (MEGA2_SIM_MODE=1 + MEGA2_SIM_COMPILE=1)
;       - Debug aktiv (MEGA2_DEBUG=1)
;
; 2) Test an der realen Anlage:
;    -> env: mega2-hw
;       - Keine Simulation (MEGA2_SIM_MODE=0)
;       - Debug aktiv (MEGA2_DEBUG=1)
;
; 3) Kalibrier-Phase (Spannung/Strom) an der Anlage:
;    -> env: mega2-hw-calib
;       - Wie mega2-hw, aber zusätzlich:
;         MEGA2_CALIB_MODE=1
;       - Damit werden Safety-Trigger (Kurzschluss/Double-Occ) entschärft,
;         um False-Trips während Mess-/Kalibrierarbeiten zu vermeiden.
;       - Hinweis: Es gibt keinen blockierenden CALIB-Messpfad mehr.
;         CALIB ist nur noch "Safety relaxed".
;       - Block-Besetzt via Strom bleibt aktiv, Schwelle kommt aus threshold_values.h
;         (THR_BLOCK_OCC_COUNTS).
;
; 4) Minimaler Write-Path Trace (wenn DIAG-Relais/WS/I2C debuggt werden):
;    -> env: mega2-hw-diagwrite  (Anlage)
;    -> env: mega2-sim-diagwrite (ohne Anlage)
;       - Aktiviert nur die DIAGW One-Liner (EE_DEBUG_DIAG_WRITE=1)
;
; Default:
; -> env: mega2-release
;    - Ruhig, ohne Simulation, MEGA2_DEBUG=0
;    - Sollte als "sicherer Standard" dienen.
;
; Backwards compatibility:
; -> env: mega2  ist nur ein Alias auf mega2-sim
;
; Hinweise:
; - Thresholds / Kalibrierwerte: include/threshold_values.h
; - MEGA2_CALIB_MODE wird per build_flag gesetzt (nicht per Code-Änderung nötig)
; ============================================================

; ------------------------------------------------------------
; RELEASE (Default): ruhig & sicher – keine Simulation, MEGA2_DEBUG=0
; Nimm das als Standard, wenn du nicht explizit testen/kalibrieren willst.
[env:mega2-release]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

build_flags =
    -DMEGA2_DEBUG=0
    -DMEGA2_SIM_MODE=0
    -Wl,-Map,.pio/build/${PIOENV}/firmware.map

monitor_filters = send_on_enter, printable

; ------------------------------------------------------------
; SIM (ohne Anlage): Simulation aktiv + Debug an
; Für Entwicklung am Schreibtisch (MEGA2_SIM_MODE=1 + MEGA2_SIM_COMPILE=1).
[env:mega2-sim]
extends = env:mega2-release
build_type = debug

build_unflags =
    -flto
    -DMEGA2_DEBUG=0
    -DMEGA2_SIM_MODE=0

build_flags =
    ${env:mega2-release.build_flags}
    ${debug_common.build_flags}
    -DMEGA2_DEBUG=1
    -DMEGA2_SIM_MODE=1
    -DMEGA2_DEBUG_ANALOG_TICK=1
    -DMEGA2_SIM_COMPILE=1

monitor_filters = send_on_enter, printable

; ------------------------------------------------------------
; HW (Realanlage): Keine Simulation, Debug an
; Für Tests direkt an der Anlage (MEGA2_SIM_MODE=0).
[env:mega2-hw]
extends = env:mega2-release
build_type = debug

build_unflags =
    -DMEGA2_DEBUG=0
    -DMEGA2_SIM_MODE=0

build_flags =
    ${env:mega2-release.build_flags}
    ${debug_common.build_flags}
    -DMEGA2_DEBUG=1
    -DMEGA2_SIM_MODE=0
    -DMEGA2_DEBUG_ANALOG_TICK=1

monitor_filters = send_on_enter, printable


; ------------------------------------------------------------
; Minimal E2E write-path tracing (I2C cmd rx/gate + pulse)
; Enables only the dedicated DIAGW one-line logs added in this chat.
; ------------------------------------------------------------
[env:mega2-hw-diagwrite]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DEE_DEBUG_DIAG_WRITE=1

; ------------------------------------------------------------
; SIM DIAGWRITE: Wie mega2-sim, aber mit minimalem Write-Pfad Trace
; Praktisch zum Debuggen ohne Anlage, wenn DIAGW-Logs gebraucht werden.
[env:mega2-sim-diagwrite]
extends = env:mega2-sim
build_flags =
    ${env:mega2-sim.build_flags}
    -DEE_DEBUG_DIAG_WRITE=1

; ------------------------------------------------------------
; Alias: "mega2" bleibt als alter Name erhalten und zeigt auf mega2-sim
; Damit funktionieren alte Scripts/Kommandos weiter unverändert.
[env:mega2]
extends = env:mega2-sim


; ------------------------------------------------------------
; PERF QUIET (optional): wie mega2-hw, aber DBG_PRINT/DBG_PRINTF stumm
; Zweck: Serial-Impact auf Loop-Jitter/maxGapUs messen.
; Hinweis: [LOOP]/[LPS] Logs bleiben aktiv, da sie nicht über DBG_* laufen.
[env:mega2-hw-perfquiet]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DMEGA2_PERF_QUIET=1

; ------------------------------------------------------------
; PERF QUIET (SIM): wie mega2-sim, aber DBG_* stumm
[env:mega2-sim-perfquiet]
extends = env:mega2-sim
build_flags =
    ${env:mega2-sim.build_flags}
    -DMEGA2_PERF_QUIET=1

; ------------------------------------------------------------
; NO I2C (HW): wie mega2-hw, aber I2C-Service deaktiviert
; Zweck: I2C-Impact auf Loop-Jitter/maxGapUs messen.
[env:mega2-hw-noi2c]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DMEGA2_PERF_NO_I2C=1

; ------------------------------------------------------------
; NO I2C (SIM): wie mega2-sim, aber I2C-Service deaktiviert
[env:mega2-sim-noi2c]
extends = env:mega2-sim
build_flags =
    ${env:mega2-sim.build_flags}
    -DMEGA2_PERF_NO_I2C=1

; ------------------------------------------------------------
; PERF QUIET + NO I2C (HW)
[env:mega2-hw-perfquiet-noi2c]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DMEGA2_PERF_QUIET=1
    -DMEGA2_PERF_NO_I2C=1

; ------------------------------------------------------------
; HW CALIB (Realanlage): Wie mega2-hw, aber Safety-Trigger entschärft
; Für Spannungs-/Strom-Kalibrierung: MEGA2_CALIB_MODE=1.
[env:mega2-hw-calib]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
        -DMEGA2_CALIB_MODE=1

; ------------------------------------------------------------
; NO ANALOG DEBUG TICK (HW)
; Zweck: Prüfen, ob mega2DebugAnalogTick() die ~11ms maxGapUs verursacht.
[env:mega2-hw-noanalogtick]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DMEGA2_PERF_NO_ANALOGTICK=1