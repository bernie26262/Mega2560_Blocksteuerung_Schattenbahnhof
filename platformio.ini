[platformio]
default_envs = mega2-sim

[env]
monitor_port = COM6
monitor_speed = 115200
upload_port = COM6

[env:mega2-sim]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

build_unflags =
    -flto

build_flags =
    -DMEGA2_DEBUG=1
    -DMEGA2_SIM_MODE=1
    -DMEGA2_DEBUG_ANALOG_TICK=1
    -fno-lto
    -Wl,-Map,.pio/build/${PIOENV}/firmware.map

monitor_filters = send_on_enter, printable

[env:mega2-hw]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

build_flags =
    -DMEGA2_DEBUG=1
    -DMEGA2_SIM_MODE=0
    -DMEGA2_DEBUG_ANALOG_TICK=1
    -Wl,-Map,.pio/build/${PIOENV}/firmware.map

monitor_filters = send_on_enter, printable


; ------------------------------------------------------------
; Minimal E2E write-path tracing (I2C cmd rx/gate + pulse)
; Enables only the dedicated DIAGW one-line logs added in this chat.
; ------------------------------------------------------------
[env:mega2-hw-diagwrite]
extends = env:mega2-hw
build_flags =
    ${env:mega2-hw.build_flags}
    -DEE_DEBUG_DIAG_WRITE=1
    -DMEGA2_DEBUG_ANALOG_TICK=1

[env:mega2-sim-diagwrite]
extends = env:mega2-sim
build_flags =
    ${env:mega2-sim.build_flags}
    ; keep SIM, but avoid extra analog spam while tracing writes
    -DMEGA2_DEBUG_ANALOG_TICK=1
    -DEE_DEBUG_DIAG_WRITE=1

; Backwards compatibility: keep old env name "mega2" (SIM by default)
[env:mega2]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

build_flags =
    -DMEGA2_DEBUG=1
    -DMEGA2_SIM_MODE=1
    -Wl,-Map,.pio/build/${PIOENV}/firmware.map

monitor_filters = send_on_enter, printable
